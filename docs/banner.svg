<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="phas.dev, a developer portfolio you can type into">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171a"/>
      <stop offset="1" stop-color="#0b0c0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a43a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0a43a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0a43a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#2a2d31"/>
  <!-- Window bar -->
  <circle cx="34" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="7" fill="#febc2e"/>
  <circle cx="82" cy="32" r="7" fill="#28c840"/>
  <text x="640" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8e8a83">guest@phas.dev: ~</text>
  <line x1="0" y1="62" x2="1280" y2="62" stroke="#2a2d31"/>
  <!-- Prompt -->
  <text x="640" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#8e8a83">guest@phas.dev:~$ <tspan fill="#dcd9d2">whoami</tspan><tspan fill="#f0a43a">▋<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <!-- Name -->
  <text x="640" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="104" font-weight="700" letter-spacing="-3" fill="#dcd9d2">phas<tspan fill="#f0a43a">.dev</tspan></text>
  <rect x="340" y="276" width="600" height="2" fill="url(#glow)"/>
  <text x="640" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#b9b5ad">a developer portfolio you can type into</text>
  <text x="640" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6f6b65">terminal · resume · themes · four online games</text>
</svg>
