# Type check and build on every push and pull request, so a broken main shows up here
# before Railway tries to deploy it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `build` runs tsc first, then Vite, then writes the SEO files.
      - run: pnpm build
      - name: Built pages and SEO files are there
        run: |
          for f in index.html en.html curriculo.html resume.html robots.txt sitemap.xml llms.txt resume.md curriculo.md sw.js manifest.webmanifest; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
      - name: Server starts and answers
        run: |
          PORT=8080 node server/index.ts &
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/resume)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nao-existe)" = 404
          curl -sI localhost:8080/ | grep -qi '^content-security-policy:'

  # The production image, built and started as Railway runs it: catches a file the image leaves out.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phas-dev .
      - name: The image's server starts and answers
        run: |
          docker run -d --name web -p 8080:8080 -e PORT=8080 phas-dev
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/resume)" = 200
      - name: As on Railway (root, with a volume) it drops to node and saves scores
        run: |
          docker volume create scores
          docker run -d --name web2 -u 0 -p 8081:8080 -e PORT=8080 -e DATA_DIR=/data -v scores:/data phas-dev
          for i in $(seq 1 30); do curl -fs localhost:8081/health && break; sleep 1; done
          RUN=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"game":"snake"}' localhost:8081/api/run | python3 -c 'import sys, json; print(json.load(sys.stdin)["run"])')
          sleep 2
          curl -fs -X POST -H 'Content-Type: application/json' -d "{\"game\":\"snake\",\"run\":\"$RUN\",\"name\":\"ci\",\"score\":10}" localhost:8081/api/scores
          docker exec web2 cat /data/scores.json | grep -q '"ci"'
          docker exec web2 grep '^Uid:' /proc/1/status | grep -q '1000'
      - name: Logs on failure
        if: failure()
        run: docker logs web || true; docker logs web2 || true
